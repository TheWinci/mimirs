[package]
name = "mimirs"
version = "2.0.0-alpha.3"
edition = "2024"
description = "Local-first engineering context for coding agents"
license = "Apache-2.0"
repository = "https://github.com/TheWinci/mimirs"
keywords = ["rag", "memory", "embeddings", "semantic-search"]
categories = ["development-tools"]
# Package the implementation, README and self-contained test fixtures.
# Docs, examples, research, planning and local agent state stay outside the crate.
include = [
    "/src/**",
    "/tests/**",
    "/README.md",
    "/LICENSE",
    "/Cargo.toml",
    "/Cargo.lock",
    "!**/.DS_Store",
    "!**/__pycache__/**",
    "!**/*.pyc",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
# Pin the inference runtime validated against TS v2. Newer q8 kernels change vectors.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries"] }
ignore = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sqlite-vec = "=0.1.9"
rusqlite_migration = "2.6.0"
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-go = "=0.25.0"

regex = "1.12.3"
unicode-normalization = "0.1.25"
icu_collator = "2.1.1"
globset = "0.4.18"
tree-sitter-java = "=0.23.5"

tree-sitter-c = "=0.24.1"

tree-sitter-cpp = "=0.23.4"

tree-sitter-c-sharp = "=0.23.1"

tree-sitter-ruby = "=0.23.1"

tree-sitter-php = "=0.24.2"

tree-sitter-scala = "=0.24.0"

tree-sitter-html = "=0.23.2"

tree-sitter-css = "=0.25.0"

tree-sitter-kotlin-ng = "=1.1.0"

tree-sitter-lua = "=0.4.1"

tree-sitter-zig = "=1.1.2"

tree-sitter-elixir = "=0.3.5"

tree-sitter-bash = "=0.25.1"

tree-sitter-toml-ng = "=0.7.0"

tree-sitter-yaml = "=0.7.1"

tree-sitter-haskell = "=0.23.1"

tree-sitter-ocaml = "=0.24.2"

tree-sitter-dart = { package = "tree-sitter-dart-orchard", version = "=0.6.0" }
uuid = { version = "1.26.1", features = ["v7", "serde"] }

tempfile = "3.27.0"
