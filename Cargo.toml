[package]
name = "mimirs"
version = "2.0.0-alpha.0"
edition = "2024"
description = "Local-first RAG and project memory for AI coding agents"
license = "Apache-2.0"
repository = "https://github.com/TheWinci/mimirs"
keywords = ["rag", "memory", "embeddings", "semantic-search"]
categories = ["development-tools"]
exclude = ["skills-lock.json", "logo.png", "/.agents", "/.claude"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
fastembed = { version = "6.0.2", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
ignore = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sqlite-vec = "=0.1.9"
rusqlite_migration = "2.6.0"

[dev-dependencies]
tempfile = "3.27.0"
