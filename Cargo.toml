[package]
name = "mimirs"
version = "2.0.0-alpha.0"
edition = "2024"
description = "Local-first RAG and project memory for AI coding agents"
license = "Apache-2.0"
repository = "https://github.com/TheWinci/mimirs"
keywords = ["rag", "memory", "embeddings", "semantic-search"]
categories = ["development-tools"]
exclude = ["skills-lock.json", "logo.png", "/.agents", "/.claude"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
# Pin the inference runtime validated against TS v2. Newer q8 kernels change vectors.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries"] }
ignore = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sqlite-vec = "=0.1.9"
rusqlite_migration = "2.6.0"
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-go = "=0.25.0"

regex = "1.12.3"
unicode-normalization = "0.1.25"
icu_collator = "2.1.1"
globset = "0.4.18"

[dev-dependencies]
tempfile = "3.27.0"
